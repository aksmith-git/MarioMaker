name: tests

# Actions minutes are limited: pushes run Linux jobs only. scripts/check.sh runs every gate
# locally (including the recomp's macOS compile check) before each commit.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The open-source course server (core/): accounts, courses, Endless / 100 Mario runs, relay.
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      # rustup reads core/rust-toolchain.toml and installs the pinned toolchain
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release -p mmk-cli
      - uses: actions/upload-artifact@v4
        with:
          name: mmk-linux
          path: core/target/release/mmk

  # Python course-format reference (smmfmt) and the proprietary-content guard's own tests.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Corpus tests skip automatically: CI has no game data or key table.
      - run: python -m unittest discover -s tests -t . -v
      - run: python scripts/test_check_no_proprietary.py -v
