name: tests

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      # rustup reads core/rust-toolchain.toml and installs the pinned toolchain
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mmk-linux
          path: core/target/debug/mmk

  app:
    needs: rust
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release -p mmk-ffi
        working-directory: core
      - run: swift build
        working-directory: app

  python:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: mmk-linux
          path: bin
      - run: chmod +x bin/mmk
      # Corpus tests skip automatically: CI has no game data or key table.
      - run: python -m unittest discover -s tests -t . -v
        env:
          MMK_BIN: bin/mmk
