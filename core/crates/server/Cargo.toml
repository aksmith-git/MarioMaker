[package]
name = "mmk-server"
description = "Self-hostable open-source course server: upload, search, download, stats, 100 Mario pools"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mmk-formats = { path = "../formats" }
mmk-netplay = { path = "../netplay" }
mmk-modes = { path = "../modes" }
serde_json.workspace = true
tiny_http = "0.12.0"
getrandom = "0.3"
ring = "0.17"
# upstream course source (src/upstream.rs): HTTPS with rustls (ring, as above)
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
mmk-editor = { path = "../editor" }
mmk-sim = { path = "../sim" }
