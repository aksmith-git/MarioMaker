[package]
name = "mmk-shell"
description = "Portable shell: winit window, wgpu renderer, gilrs gamepads, cpal audio (macOS, Windows, Linux, web)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mmk-play"
path = "src/main.rs"

[dependencies]
mmk-assets = { path = "../assets" }
mmk-audio = { path = "../audio" }
mmk-editor = { path = "../editor" }
mmk-formats = { path = "../formats" }
mmk-host = { path = "../host" }
mmk-sim = { path = "../sim" }
mmk-modes = { path = "../modes" }
mmk-ui = { path = "../ui" }
mmk-front = { path = "../front" }
bytemuck = "1.25.2"
# the wasm-bindgen feature is cpal's WebAudio backend (it only applies to wasm32)
cpal = { version = "0.18.2", features = ["wasm-bindgen"] }
gilrs = "0.11.2"
serde_json.workspace = true
wgpu = { version = "30.0.1", features = ["webgl"] }
mmk-netplay = { path = "../netplay" }
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mmk-online = { path = "../online" }
clap.workspace = true
png = "0.18.1"
pollster = "1.0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_arch = "wasm32")'.dependencies]
mmk-import = { path = "../import" }
flate2.workspace = true
console_error_panic_hook = "0.1.7"
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Document", "Element", "HtmlCanvasElement", "Performance", "Window", "console", "WebSocket", "MessageEvent", "BinaryType", "Storage"] }
