<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMCraft</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 14px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 16px; max-width: 100%; box-sizing: border-box; }
    button, select { font: inherit; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 10px; }
    button:hover:enabled, select:hover { border-color: #888; }
    button:disabled { opacity: .4; }
    select { max-width: 16em; }
    #status { opacity: .8; }
    progress { width: min(90vw, 600px); }
    canvas#mmk { width: min(100vw, calc((100vh - 90px) * 16 / 9)); aspect-ratio: 16 / 9; display: block; outline: none; }
    p { margin: 0; opacity: .7; padding: 0 16px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <!-- a folder: an asset cache made by `mmk import` (copied), or one holding the dump's
         extracted romfs/ + exefs/ (imported here, in a worker); either way it goes into this
         browser's own storage and is never uploaded -->
    <button id="import" title="An asset cache folder (mmk import), or a folder holding your dump's romfs/ and exefs/">Import game data…</button>
    <input id="folder" type="file" webkitdirectory multiple hidden>
    <select id="courses" title="Course"><option value="">Demo strip</option></select>
    <button id="open" title="SMM2 course data: .bcd, zlib (.course.zlib) or raw">Open course file…</button>
    <input id="file" type="file" hidden>
    <button id="online" title="Play this course online with up to 3 others, through a course server's relay">Play online…</button>
    <button id="forget" disabled title="Delete the game data stored in this browser">Remove game data</button>
  </header>
  <span id="status">Starting…</span>
  <progress id="progress" hidden></progress>
  <!-- the shell draws into this canvas (WebGPU, or WebGL2 where WebGPU is missing) -->
  <canvas id="mmk" tabindex="0"></canvas>
  <p>Arrows/WASD move, Z/Space jump, X/Shift run, Esc/P/Enter pause, R restart. Gamepads: d-pad/stick, A/B jump, X/Y run, Start pause. Menus: arrows, Enter/Z/Space or a click choose, Esc/Backspace go back.</p>
  <script type="module" src="./mmk-web.js"></script>
</body>
</html>
