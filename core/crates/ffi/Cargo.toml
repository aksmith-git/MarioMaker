[package]
name = "mmk-ffi"
description = "C ABI for the Swift app"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mmk_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
mmk-assets = { path = "../assets" }
mmk-import = { path = "../import" }
mmk-sim = { path = "../sim" }
mmk-audio = { path = "../audio" }
mmk-formats = { path = "../formats" }
mmk-modes = { path = "../modes" }
mmk-ui = { path = "../ui" }
mmk-host = { path = "../host" }
mmk-online = { path = "../online" }
mmk-front = { path = "../front" }
libc = "0.2.191"
serde_json.workspace = true
flate2.workspace = true

[dev-dependencies]
mmk-server = { path = "../server" }
mmk-editor = { path = "../editor" }
