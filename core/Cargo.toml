[workspace]
resolver = "3"
members = ["crates/formats", "crates/cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"   # owner has not chosen a licence yet
publish = false

[workspace.dependencies]
aes = "0.9.3"
crc32fast = "1.5.2"
flate2 = "1.1.10"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
debug = 1
