[workspace]
resolver = "3"
members = ["crates/formats", "crates/assets", "crates/import", "crates/sim", "crates/audio", "crates/modes", "crates/story", "crates/ui", "crates/front", "crates/editor", "crates/server", "crates/online", "crates/netplay", "crates/ffi", "crates/cli", "crates/host", "crates/shell"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"   # owner has not chosen a licence yet
publish = false

[workspace.dependencies]
aes = "0.9.3"
crc32fast = "1.5.2"
flate2 = "1.1.10"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
ruzstd = "0.9.1"
# scalable-font rasterizer for the SMM2 UI import; already locked (winit pulls it in on Linux)
ab_glyph = { version = "=0.2.32", default-features = false, features = ["std"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode", "std"] }

[profile.release]
debug = 1
